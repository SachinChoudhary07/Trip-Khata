name: tripkhata
description: Group trip expense splitter. Offline-first, voice entry, route log.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  go_router: ^14.6.0
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.4
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  speech_to_text: ^7.0.0
  share_plus: ^10.1.4
  geolocator: ^13.0.2
  flutter_map: ">=8.0.0 <8.2.0"
  latlong2: ^0.9.1
  flutter_contacts: ^1.1.9+2
  flutter_local_notifications: ^18.0.1
  timezone: ">=0.9.0 <0.11.0"
  pdf: ^3.11.1
  printing: ^5.13.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/onboarding/
  fonts:
    # Figtree (SIL OFL 1.1), bundled so the app looks right with no network.
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0E5E6F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
