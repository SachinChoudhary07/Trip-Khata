# Free CI: test and build a release APK on every push (GitHub Actions).
# Pushing a tag like v0.2.0 also publishes the APK as a GitHub Release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: SQLite for database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - name: Generate android/ if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com.tripkhata --project-name tripkhata --platforms=android .
          fi
      - run: flutter pub get
      - run: dart run tool/patch_android.dart
      - run: dart run flutter_launcher_icons
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tripkhata-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "tripkhata-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "tripkhata-${GITHUB_REF_NAME}.apk" \
            --title "TripKhata ${GITHUB_REF_NAME}" \
            --notes "Install: download the APK on your Android phone and open it (allow installing from this source). Works offline."
        env:
          GH_TOKEN: ${{ github.token }}
