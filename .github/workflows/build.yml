# Free CI: test and build a release APK on every push (GitHub Actions).
# A tag like v0.2.0, or a commit message containing [release], also publishes a GitHub Release.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: SQLite for database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - name: Generate android/ if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com.tripkhata --project-name tripkhata --platforms=android .
          fi
      - run: flutter pub get
      - run: dart run tool/patch_android.dart
      - run: dart run flutter_launcher_icons
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - name: Release signing key (optional, from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
            printf "storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the release key."
          else
            echo "No KEYSTORE_BASE64 secret: signing with a debug key."
          fi
      - name: Build APK (cloud sync on when Firebase secrets exist)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: tripkhata-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish GitHub Release
        # Runs for tags like v0.2.0, or for a main commit whose message contains [release]
        # (the version then comes from pubspec.yaml).
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "tripkhata-${TAG}.apk"
          gh release create "$TAG" "tripkhata-${TAG}.apk" --target "$GITHUB_SHA" \
            --title "TripKhata ${TAG}" \
            --notes "Download the APK on your Android phone and open it (allow installing from this source). Works fully offline."
        env:
          GH_TOKEN: ${{ github.token }}
