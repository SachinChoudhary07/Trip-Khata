# Free CI: test and build a release APK on every push (GitHub Actions).
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate android/ if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com.tripkhata --project-name tripkhata --platforms=android .
          fi
      - run: flutter pub get
      - run: dart run tool/patch_android.dart
      - run: dart run flutter_launcher_icons
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tripkhata-apk
          path: build/app/outputs/flutter-apk/app-release.apk
